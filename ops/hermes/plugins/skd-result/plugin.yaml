name: skd-result
version: "2.1.0"
description: Process SKD result and AnalisaCPNS verification codes without invoking an LLM.
requires_env:
  - name: SKD_APP_URL
    description: Public HTTPS origin of the chekskd application.
    secret: false
  - name: HERMES_API_SECRET
    description: Shared secret for authenticated SKD job endpoints.
    secret: true
